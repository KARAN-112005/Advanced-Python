<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>#{{ room_name }} - Chat App</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #f4f4f8; margin: 0; }
    .top-bar { background: #4f46e5; color: white; padding: 14px 20px; display: flex; justify-content: space-between; }
    .top-bar a { color: white; }
    #messages { list-style: none; margin: 0; padding: 16px; height: 60vh; overflow-y: auto; }
    #messages li { margin-bottom: 10px; }
    #messages .system { color: #6b7280; font-style: italic; font-size: 13px; }
    #messages .meta { font-size: 11px; color: #9ca3af; }
    #messages .username { font-weight: 700; color: #4f46e5; }
    form#send-form { display: flex; padding: 12px; background: white; border-top: 1px solid #e5e7eb; }
    #message-input { flex: 1; padding: 10px; }
    button { padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>#{{ room_name }} — logged in as {{ username }}</span>
    <a href="{{ url_for('rooms') }}">← All rooms</a>
  </div>

  <ul id="messages">
    {% for msg in history %}
      <li><span class="username">{{ msg.username }}:</span> {{ msg.content }}
        <div class="meta">{{ msg.sent_at }}</div>
      </li>
    {% endfor %}
  </ul>

  <form id="send-form">
    <input id="message-input" autocomplete="off" placeholder="Type a message... try :smile: or :fire:" />
    <button type="submit">Send</button>
  </form>

  <script>
    const roomName = {{ room_name | tojson }};
    const username = {{ username | tojson }};

    const socket = io();
    const messagesList = document.getElementById("messages");
    const form = document.getElementById("send-form");
    const input = document.getElementById("message-input");

    // Ask permission for desktop notifications when a message arrives
    // while this tab isn't focused.
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    socket.on("connect", () => {
      socket.emit("join", { room: roomName, username: username });
    });

    socket.on("system_message", (data) => {
      const li = document.createElement("li");
      li.className = "system";
      li.textContent = data.text;
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    });

    socket.on("new_message", (data) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="username">${escapeHtml(data.username)}:</span> ${escapeHtml(data.message)}
                      <div class="meta">${escapeHtml(data.sent_at)}</div>`;
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;

      // In-app / desktop notification for new messages when the
      // window/tab is not focused (and it's not our own message).
      if (document.hidden && data.username !== username) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(`${data.username} in #${roomName}`, { body: data.message });
        }
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      socket.emit("send_message", { room: roomName, username: username, message: text });
      input.value = "";
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
